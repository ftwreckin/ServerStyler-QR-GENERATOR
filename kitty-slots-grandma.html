<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000"><title>Kitty Slots</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}button{font:inherit;touch-action:manipulation}
#wrap{position:fixed;inset:0;display:grid;place-items:center;background:#000}#game{position:relative;width:min(100vw,calc(100dvh*1.5));height:min(100dvh,calc(100vw/1.5));aspect-ratio:3/2;overflow:hidden}
#shell{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none}
#reels{position:absolute;left:7.875%;top:14.746%;width:60.25%;height:53.32%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);background:#a26712;border:.25vw solid #ffba22;border-radius:.75vw;overflow:hidden;z-index:3}.cell{position:relative;overflow:hidden;background:#faeac0;border-right:.13vw solid #b97921;border-bottom:.13vw solid #b97921}.cell:nth-child(5n){border-right:0}.cell:nth-last-child(-n+5){border-bottom:0}.cell img{width:100%;height:100%;object-fit:cover;display:block}.cell.win{box-shadow:inset 0 0 0 .34vw #ffe84e,inset 0 0 1vw #fff176;z-index:2}.cell.spinCell img{filter:blur(1.4px);transform:translateY(2%) scale(1.015)}.cell .motion{position:absolute;inset:0;opacity:0;background:repeating-linear-gradient(180deg,transparent 0 8%,rgba(255,255,255,.13) 9% 11%,transparent 12% 20%);pointer-events:none}.cell.spinCell .motion{opacity:1;animation:motion .075s linear infinite}@keyframes motion{from{transform:translateY(-9%)}to{transform:translateY(9%)}}
.live{position:absolute;z-index:6;display:grid;place-items:center;text-align:center;font-weight:1000;white-space:nowrap;text-shadow:0 .1vw .12vw #000;pointer-events:none}#balance{left:3%;top:6.2%;width:13.3%;height:4.9%;font-size:2.25vw}#lines{left:8.2%;top:76%;width:4.7%;height:4.6%;font-size:2.25vw}#bet{left:25.4%;top:76%;width:11.5%;height:4.6%;font-size:2.15vw}#total{left:22.9%;top:83.1%;width:16%;height:3.2%;font-size:1.02vw;color:#49e42a}#win{left:41.7%;top:76%;width:13.8%;height:4.8%;font-size:2.45vw}#status{left:41%;top:83%;width:15.2%;height:3.2%;font-size:1.02vw;color:#35c8ff}#progress{left:20.6%;top:92.5%;width:15%;height:3.1%;font-size:1.02vw}#progressHint{position:absolute;left:16.4%;top:96%;width:23%;height:2.4%;z-index:6;text-align:center;font-size:.68vw;color:#ddd;pointer-events:none}#clock{left:69.1%;top:92.4%;width:10.7%;height:3.2%;font-size:1.45vw;color:#a338e8}#freeBadge{position:absolute;left:59%;top:84%;z-index:9;display:none;background:#4b0b59;border:.12vw solid #ffbf28;border-radius:.45vw;padding:.22vw .42vw;font-weight:1000;color:#ffe657;font-size:.78vw}#freeBadge.show{display:block}
.hot{position:absolute;z-index:12;background:transparent;border:0;padding:0}#lineMinus{left:2.3%;top:74.5%;width:5.6%;height:8.2%}#linePlus{left:13.5%;top:74.5%;width:5.6%;height:8.2%}#betMinus{left:20%;top:74.5%;width:5.5%;height:8.2%}#betPlus{left:34.5%;top:74.5%;width:5.4%;height:8.2%}#maxBet{left:55.5%;top:72.7%;width:8%;height:13.4%}#spinBtn{left:64%;top:72.7%;width:13.5%;height:13.5%}#payHold{left:72.4%;top:1.7%;width:14.3%;height:10.2%}#gear{left:91.1%;top:1.2%;width:6.1%;height:10.3%}#soundBtn{left:42%;top:90.1%;width:11.2%;height:7.5%}#vibeBtn{left:53.7%;top:90.1%;width:12%;height:7.5%}#chestBtn{left:35.4%;top:89.5%;width:5%;height:8%}
#wheel{position:absolute;left:78.3%;top:23.2%;width:20.5%;aspect-ratio:1;z-index:9;border-radius:50%;box-shadow:0 0 1vw #ffbd27}#wheelArm{position:absolute;left:88.13%;top:32.95%;width:.9%;height:10.2%;z-index:12;transform-origin:50% 100%;transform:rotate(0deg);will-change:transform}#wheelArm:before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);width:.32vw;height:7.4vw;background:linear-gradient(#ffe460,#e89513);border:.06vw solid #6d3e00;border-radius:.2vw}#wheelArm:after{content:"";position:absolute;left:50%;top:-.55vw;transform:translateX(-50%);width:1.15vw;height:1.15vw;border-radius:50%;background:#ffd138;border:.08vw solid #824b00}#wheelHub{position:absolute;left:86.6%;top:42%;width:3.8%;aspect-ratio:1;z-index:13;border-radius:50%;background:radial-gradient(circle,#d14ced 0 35%,#7f1791 36% 68%,#ffbf26 69% 100%)}#wheelSpin{position:absolute;left:79.7%;top:64.5%;width:17.8%;height:7.5%;z-index:14;background:transparent;border:0}#wheelStatus{position:absolute;left:78.1%;top:72.3%;width:20.7%;height:2.2%;z-index:11;text-align:center;font-size:.7vw;font-weight:900;color:#eee}
#toast{position:absolute;z-index:50;left:50%;top:14%;transform:translateX(-50%);display:none;padding:.48em .8em;border:.14vw solid #ffbd2d;border-radius:.55vw;background:#110713;color:#ffe84d;font-size:1.2vw;font-weight:1000}#toast.show{display:block}@media(orientation:portrait){#wrap:before{content:"Turn your phone sideways";position:absolute;inset:0;z-index:100;background:#000;display:grid;place-items:center;font-size:7vw;font-weight:900}}
</style></head><body><div id="wrap"><main id="game"><img id="shell" alt=""><div id="reels"></div><div id="balance" class="live"></div><div id="lines" class="live"></div><div id="bet" class="live"></div><div id="total" class="live"></div><div id="win" class="live"></div><div id="status" class="live"></div><div id="progress" class="live"></div><div id="progressHint"></div><div id="clock" class="live"></div><div id="freeBadge"></div><button class="hot" id="lineMinus"></button><button class="hot" id="linePlus"></button><button class="hot" id="betMinus"></button><button class="hot" id="betPlus"></button><button class="hot" id="maxBet"></button><button class="hot" id="spinBtn"></button><button class="hot" id="payHold"></button><button class="hot" id="gear"></button><button class="hot" id="soundBtn"></button><button class="hot" id="vibeBtn"></button><button class="hot" id="chestBtn"></button><div id="wheel"></div><div id="wheelArm"></div><div id="wheelHub"></div><button id="wheelSpin"></button><div id="wheelStatus"></div><div id="toast"></div><script>document.body.innerHTML='<div style="color:white;font:700 26px Arial;padding:30px">Hosted build placeholder</div>';</script></main></div></body></html>
